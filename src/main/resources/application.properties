spring.application.name=campuscare
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---------- Database ----------
# Default: embedded H2 database stored in ./data (no installation, nothing to configure).
# To use MySQL/PostgreSQL instead, set DB_URL, DB_USERNAME and DB_PASSWORD, e.g.
#   DB_URL=jdbc:mysql://localhost:3306/campuscare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campuscare;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
campuscare.upload-dir=${UPLOAD_DIR:uploads}

# ---------- Session / cookies ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set COOKIE_SECURE=true when served over HTTPS (online deployment)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------- First administrator (set via environment variables) ----------
# Created once at startup, only if no ADMIN exists yet. Never hard-code these.
campuscare.admin.name=${ADMIN_NAME:CampusCare Admin}
campuscare.admin.email=${ADMIN_EMAIL:}
campuscare.admin.password=${ADMIN_PASSWORD:}

# Optional: restrict registration to one college domain, e.g. college.edu (blank = any valid email)
campuscare.email-domain=${COLLEGE_EMAIL_DOMAIN:}
