<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | CampusCare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d448f'/%3E%3Cpath d='M32 12l18 7v14c0 10-8 17-18 21-10-4-18-11-18-21V19z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 33l6 6 11-12' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin-dashboard">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" data-icon="menu" data-size="22"></button>
      <h1 id="pageTitle">Admin Dashboard</h1>
      <div class="topbar-user" id="topUser"></div>
    </header>
    <section class="content">
      <div class="page-head"><h2>Complaint overview</h2><p class="muted">Live totals across the whole campus.</p></div>
      <div class="stats" id="stats"></div>
      <div id="charts" class="grid-2 hidden">
        <div class="card"><h3>Complaints by category</h3><div id="catChart"></div></div>
        <div class="card"><h3>Complaints by department</h3><div id="deptChart"></div></div>
        <div class="card"><h3>Status distribution</h3><div id="statusChart"></div></div>
      </div>
    </section>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
