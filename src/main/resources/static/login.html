<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | CampusCare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d448f'/%3E%3Cpath d='M32 12l18 7v14c0 10-8 17-18 21-10-4-18-11-18-21V19z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 33l6 6 11-12' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
<div class="auth">
  <div class="auth-side">
    <a class="brand" href="/"><span class="logo" data-icon="shield" data-size="20"></span><span>Campus<b>Care</b></span></a>
    <div><h2>Problems on campus get fixed faster when they are tracked.</h2><p>Log in to raise a complaint, follow its progress, or manage the queue as an administrator.</p></div>
    <small>CampusCare &ndash; Campus Complaint &amp; Issue Management System</small>
  </div>
  <div class="auth-main">
    <div class="auth-box">
      <h1>Log in</h1>
      <p class="muted">Use the email you registered with.</p>
      <div id="formAlert"></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">College email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="you@college.edu"><div class="field-error" data-error-for="email"></div></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><div class="field-error" data-error-for="password"></div></div>
        <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Log in</button>
      </form>
      <p class="auth-foot">New here? <a href="/register.html">Create a student account</a></p>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
